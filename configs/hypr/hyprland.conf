#
# MONITEURS
# Définition de la résolution et du taux de rafraîchissement (à adapter selon votre écran)
#
monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = HDMI-A-1, preferred, auto, 1


#
# PROGRAMMES AU DÉMARRAGE (AUTORESTART / DAEMONS)
#
exec-once = waybar &                     # Barre des tâches
exec-once = dunst &                      # Notifications
exec-once = nm-applet --indicator &      # Gestionnaire réseau
exec-once = vesktop &                    # wayabar
exec-once = hyprpaper &
exec-once = blueman-applet &


#
# VARIABLES D'ENVIRONNEMENT (POUR WAYLAND)
#
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = QT_QPA_PLATFORM, wayland
env = SDL_VIDEODRIVER, wayland


#
# CONFIGURATION DU CLAVIER ET DE LA SOURIS
#
input {
    kb_layout = fr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

#
# APPARENCE ET EFFETS VISUELS
#
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(89b4fa) rgb(2A00A5) 45deg
    col.inactive_border = rgb(45475a)

    layout = dwindle
}

decoration {
    rounding = 5

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    active_opacity = 0.9      
    inactive_opacity = 0.8    
    fullscreen_opacity = 1.0  

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

#
# RACCOURCIS CLAVIER (KEYBINDINGS)
# Définition de la touche Super (touche Windows) comme modificateur principal
#
$mainMod = SUPER

# Augmenter / diminuer le volume (par pas de 5%)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Couper / rétablir le son (Mute)
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Couper / rétablir le microphone
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Applications principales
bind = $mainMod, RETURN, exec, alacritty         # Terminal (remplacer par votre terminal favori)
bind = $mainMod SHIFT, Q, killactive,              # Fermer la fenêtre active
bind = $mainMod SHIFT, E, exit,                    # Quitter Hyprland
bind = $mainMod CTRL SHIFT, P, exec, poweroff
bind = $mainMod, D, exec, rofi -show drun  # Lanceur d'applications (Rofi)

# Gestion des fenêtres
bind = $mainMod, SPACE, togglefloating,          # Basculer en mode fenêtré flottant
bind = $mainMod, P, pseudo,                  # Mode pseudo-tiling

# Déplacement du focus (touches Vim ou flèches)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Déplacer la fenêtre active avec Super + Maj + Flèches
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Changer de workspace
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parenleft, workspace, 5

# Déplacer la fenêtre active vers un workspace
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5

# Lock
bind = CTRL $mainMod, I, exec, hyprlock
